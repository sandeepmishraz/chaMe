<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>All Users - chaMe</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/theme.css}">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
	<div class="container">
		<!-- Profile Section -->
		<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
			<div class="container-fluid">
				<a class="navbar-brand fw-bold">chaMe</a>

				<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
					<span class="navbar-toggler-icon"></span>
				</button>

				<div id="nav" class="collapse navbar-collapse">
					<ul class="navbar-nav ms-auto">
						<li class="nav-item"><a class="nav-link" href="feed">Feed</a></li>
						<li class="nav-item"><a class="nav-link" href="myFriends">Friends</a></li>
						<li class="nav-item"><a class="nav-link" href="allUsers">Users</a></li>
						<li class="nav-item"><a class="nav-link" href="friendRequests">Requests</a></li>
						<li class="nav-item"><a class="nav-link" href="myPosts">Posts</a></li>
						<li class="nav-item"><a class="nav-link text-danger" href="logout">Logout</a></li>
					</ul>
				</div>
			</div>
		</nav>
	</div>
	
	<br/><br/>
	
	<div class="container mt-4">
		<h2 class="mb-4">👤 All Users</h2>
		<table class="table table-hover">
			<thead class="table-light">
				<tr>
					<th>#</th>
					<th>Name</th>
					<th>Email</th>
					<th>Add Friend</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="user, iterStat : ${account}">
					<td th:text="${iterStat.count}"></td>
					<td th:text="${user.firstName + ' ' + user.lastName}"></td>
					<td th:text="${user.email}"></td>
					<td>
						<!-- 						<form th:action="@{/addFriend}" method="post" class="d-inline"> -->
						<!-- 							<input type="hidden" name="friendEmail" th:value="${user.email}" /> -->
						<!-- 							Remove 'th:disabled' if already filtered in controller -->
						<!-- 							<button type="submit" class="btn btn-sm btn-outline-primary">Add -->
						<!-- 								Friend</button> --> <!-- 						</form> -->

						<form th:action="@{/sendRequest}" method="post" class="d-inline">
							<input type="hidden" name="receiverEmail"
								th:value="${user.email}" />
							<button type="submit" class="btn btn-sm btn-outline-success">Send
								Friend Request</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
	<script th:src="@{/js/theme-toggle.js}"></script>

</body>
</html>
