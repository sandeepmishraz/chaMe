<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Chat - chaMe</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/theme.css}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
	<div class="container-fluid">
		<a class="navbar-brand fw-bold">chaMe</a>

		<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div id="nav" class="collapse navbar-collapse">
			<ul class="navbar-nav ms-auto">
				<li class="nav-item"><a class="nav-link" href="feed">Feed</a></li>
				<li class="nav-item"><a class="nav-link" href="myFriends">Friends</a></li>
				<li class="nav-item"><a class="nav-link" href="allUsers">Users</a></li>
				<li class="nav-item"><a class="nav-link" href="friendRequests">Requests</a></li>
				<li class="nav-item"><a class="nav-link" href="myPosts">Posts</a></li>
				<li class="nav-item"><a class="nav-link text-danger" href="logout">Logout</a></li>
			</ul>
		</div>
	</div>
</nav>

<br><br><br>

<div class="container mt-4">

	<!-- HEADER -->
	<div class="chat-header text-center fw-bold mb-2">
		Chat with <span th:text="${friendEmail}"></span>
	</div>

	<!-- CHAT BOX -->
	<div id="chat-box" class="chat-box mb-3">

		<div th:each="msg : ${messages}">
			<div th:class="${msg.sender == currentUserEmail} ? 'msg-sent' : 'msg-received'">

				<div th:text="${msg.content}"></div>

				<small class="d-block text-end"
				       th:text="${#temporals.format(msg.date, 'HH:mm')}"></small>

			</div>
		</div>

	</div>

	<!-- INPUT -->
	<form th:action="@{/sendMessage}" method="post" class="d-flex gap-2">

		<input type="hidden" name="sender" th:value="${currentUserEmail}" />
		<input type="hidden" name="receiver" th:value="${friendEmail}" />

		<input type="text" name="content"
		       class="form-control rounded-pill"
		       placeholder="Type message..." required>

		<button class="btn btn-primary rounded-pill px-3">➤</button>

	</form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/theme-toggle.js}"></script>

<script>
	function scrollToBottom() {
		const container = document.getElementById('chat-box');
		container.scrollTop = container.scrollHeight;
	}
	scrollToBottom();
</script>

</body>
</html>
