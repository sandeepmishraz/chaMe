<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>All Users - chaMe</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/theme.css}">

</head>
<body>
<!-- Profile Section -->
<button id="darkModeToggle" class="btn btn-sm btn-outline-dark position-absolute top-0 end-0 m-3">
    🌙 Dark Mode
</button>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold">chaMe</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div id="nav" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="feed">Feed</a></li>
                <li class="nav-item"><a class="nav-link" href="myFriends">Friends</a></li>
                <li class="nav-item"><a class="nav-link" href="allUsers">Users</a></li>
                <li class="nav-item"><a class="nav-link" href="friendRequests">Requests</a></li>
                <li class="nav-item"><a class="nav-link" href="myPosts">Posts</a></li>
                <li class="nav-item"><a class="nav-link text-danger" href="logout">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<br/> <br/><br/> <br/>
	<h3>Incoming Friend Requests</h3>
<table class="table">
    <tr th:each="request : ${requests}">
        <td th:text="${request.senderEmail}"></td>
        <td>
            <form th:action="@{/respondRequest}" method="post" class="d-inline">
                <input type="hidden" name="requestId" th:value="${request.id}" />
                <button name="action" value="accept" class="btn btn-success">Accept</button>
                <button name="action" value="reject" class="btn btn-danger">Reject</button>
            </form>
        </td>
    </tr>
</table>
	<script th:src="@{/js/theme-toggle.js}"></script>
	
</body>
</html>
